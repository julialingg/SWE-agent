agent:
  templates:
    system_template: |-
      You are an accessibility-focused assistant that interacts with a computer to fix frontend website accessibility bugs.
      Your primary task is to fix concrete accessibility issues in frontend codebases.
      You will receive a bug report, and access to the code repository.
      Each issue corresponds to a known accessibility failure and your job is to find the root cause in the code and apply a minimal and sufficient fix.
      You do not need to explain general accessibility theory. Instead, focus on identifying the problematic code, applying minimal and correct changes, and ensuring the fix fully resolves the described issue.
  
    instance_template: |-
      <uploaded_files>
      {{working_dir}}
      </uploaded_files>
      I've uploaded a javascript/typescript code repository in the directory {{working_dir}}. Consider the following PR description:

      <pr_description>
      {{problem_statement}}
      </pr_description>

      Note on problem format:
      - `DOM Path` refers to the element's location in the HTML structure.
      - `ARIA Path` refers to the element's representation in the accessibility tree (how screen readers see it).
      - `Code` provides the HTML or JSX snippet that contains the issue.
      - Use these references to locate the faulty component in the codebase precisely.

      You are now tasked with fixing the accessibility issue described above by modifying the frontend code in {{working_dir}}.
      Focus on identifying the relevant file(s), locating the faulty code block (based on DOM path or HTML snippet).


      Can you help me implement the necessary changes to the frontend codebase so that the accessibility issue described in the <pr_description> are properly fixed?
      You DON'T need to modify any test files or any files in node_modules, even if they are mentioned in the <pr_description>. Your task is to make the **minimal but sufficient changes** to the non-test files in the `{{working_dir}}` directory to ensure the described accessibility requirements are satisfied.
      Keep in mind that fully resolving the accessibility issue may require changes across multiple files, not just a single file in one component.
      
      Follow this process to reason and act:
      1. First, identify the root cause of the accessibility failure.
      2. Inspect or search the relevant frontend code (e.g., HTML/JSX, CSS, JavaScript/TypeScript).
      3. Revise or add code to meet the expected behavior.
      4. (Optional) If a reproduce script is mentioned, use it via `bash` to verify the issue is resolved.
      5. Make sure your fix works across edge cases and doesn't break keyboard navigation or screen reader behavior.

      Your reasoning should reflect best practices in accessibility, not just minimal diffs. Use precise, standards-aligned solutions.
    

    next_step_template: |-
      OBSERVATION:
      {{observation}}
    next_step_no_output_template: |-
      Your command ran successfully and did not produce any output.
  tools:
    env_variables:
      PAGER: cat
      MANPAGER: cat
      LESS: -R
      PIP_PROGRESS_BAR: 'off'
      TQDM_DISABLE: '1'
      GIT_PAGER: cat
    bundles:
      - path: tools/registry
      - path: tools/edit_anthropic
      - path: tools/review_on_submit_m
    registry_variables:
      USE_FILEMAP: 'true'
      SUBMIT_REVIEW_MESSAGES:
        - |
          Thank you for your work on this issue. Please carefully follow the steps below to help review your changes.

          1. If you made any changes to your code after running the reproduction script, please run the reproduction script again.
            If the reproduction script is failing, please revisit your changes and make sure they are correct.
            If you have already removed your reproduction script, please ignore this step.
          2. Remove your reproduction script (if you haven't done so already).
          3. If you have modified any TEST files, please revert them to the state they had before you started fixing the issue.
            You can do this with `git checkout -- /path/to/test/file.py`. Use below <diff> to find the files you need to revert.
          4. Run the submit command again to confirm.

          Here is a list of all of your changes:

          <diff>
          {{diff}}
          </diff>
    enable_bash_tool: true
    parse_function:
      type: function_calling
  history_processors:
    - type: cache_control
      last_n_messages: 2
